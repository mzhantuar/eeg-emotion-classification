project:
  name: eeg-emotion-classification
  seed: 42

data:
  root: data/raw/deap
  sampling_rate: 128
  eeg_channels: 32
  expected_subjects: 32
  expected_trials_per_subject: 40

task:
  label: valence
  threshold: 5.0
  low_class: 0
  high_class: 1

windowing:
  seconds: 4
  overlap: 0.5
  remove_baseline_seconds: 3

split:
  train_subjects: 24
  validation_subjects: 4
  test_subjects: 4

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  early_stopping_patience: 8

